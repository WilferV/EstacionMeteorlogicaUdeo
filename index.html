<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación Meteorológica 4G LTE</title>
    <!-- Firebase Web SDK (v8 Compat para máxima sencillez) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .status { text-align: center; color: #4ade80; font-size: 0.9em; margin-bottom: 25px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #334155; }
        .card.highlight { border: 1px solid #38bdf8; }
        .title { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 10px; }
        .value { font-size: 2em; font-weight: bold; color: #f1f5f9; }
        .unit { font-size: 0.5em; color: #0284c7; }
        .tag { font-size: 0.7em; background: #334155; padding: 2px 8px; border-radius: 10px; margin-top: 8px; display: inline-block; color: #cbd5e1; }
    </style>
</head>
<body>
    <h1>Estación Meteorológica (4G LTE)</h1>
    <div class="status">● Conexión Nube Firebase: Activa</div>

    <div class="grid">
        <div class="card">
            <div class="title">Temperatura</div>
            <div class="value"><span id="temp">--</span><span class="unit"> °C</span></div>
            <div class="tag">DHT22 / BMP280</div>
        </div>
        <div class="card highlight">
            <div class="title">Humedad</div>
            <div class="value"><span id="hum">--</span><span class="unit"> %</span></div>
            <div class="tag">DHT22</div>
        </div>
        <div class="card">
            <div class="title">Presión Atmosférica</div>
            <div class="value"><span id="pres">--</span><span class="unit"> hPa</span></div>
            <div class="tag">BMP280</div>
        </div>
        <div class="card highlight">
            <div class="title">Precipitación</div>
            <div class="value"><span id="lluvia">0.0</span><span class="unit"> mm</span></div>
            <div class="tag">Vuelcos: <span id="clics">0</span></div>
        </div>
        <div class="card highlight">
            <div class="title">Dirección Viento</div>
            <div class="value" style="font-size: 1.4em;"><span id="dir">--</span></div>
            <div class="tag">Veleta Resistiva</div>
        </div>
        <div class="card">
            <div class="title">Ubicación GPS</div>
            <div class="value" style="font-size: 1em; margin-top: 10px;">
                Lat: <span id="lat">--</span><br>
                Lon: <span id="lng">--</span>
            </div>
            <div class="tag">Altitud: <span id="alt">--</span> m</div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE FIREBASE (Cambia la URL por la tuya)
        const firebaseConfig = {
            databaseURL: "https://estacionmeteorologica-cd608-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const dbRef = firebase.database().ref('estacion');

        // Escucha cambios en tiempo real automáticamente
        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('temp').innerText = data.temp;
                document.getElementById('hum').innerText = data.hum;
                document.getElementById('pres').innerText = data.pres;
                document.getElementById('lluvia').innerText = data.lluvia;
                document.getElementById('clics').innerText = data.clics;
                document.getElementById('dir').innerText = data.dir;
                document.getElementById('lat').innerText = data.lat;
                document.getElementById('lng').innerText = data.lng;
                document.getElementById('alt').innerText = data.alt;
            }
        });
    </script>
</body>
</html>
